name: Python Tests

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'ml-service/**'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'ml-service/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r ml-service/requirements.txt
        
    - name: Run tests
      run: |
        cd ml-service
        pytest