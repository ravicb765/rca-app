{{- if .Values.mlService.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rca-app.fullname" . }}-ml-service
  labels:
    {{- include "rca-app.labels" . | nindent 4 }}
    component: ml-service
spec:
  type: {{ .Values.mlService.service.type }}
  ports:
    - port: {{ .Values.mlService.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "rca-app.selectorLabels" . | nindent 4 }}
    component: ml-service
{{- end }}
