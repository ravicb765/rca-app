<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rca-grad" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00F2FE"/>
      <stop offset="1" stop-color="#4FACFE"/>
    </linearGradient>
    <filter id="rca-glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="blur" in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background Hexagon -->
  <path d="M128 32 L224 88 V200 L128 256 L32 200 V88 L128 32Z" fill="url(#rca-grad)" fill-opacity="0.05" stroke="url(#rca-grad)" stroke-width="2"/>
  
  <!-- Outer Circles -->
  <circle cx="128" cy="128" r="90" stroke="url(#rca-grad)" stroke-width="1" stroke-dasharray="10 5" opacity="0.3">
    <animateTransform attributeName="transform" type="rotate" from="0 128 128" to="360 128 128" dur="20s" repeatCount="indefinite" />
  </circle>
  
  <!-- Inner Diagnostic Graph -->
  <g filter="url(#rca-glow)">
    <!-- The 'R' focus path -->
    <path d="M80 176 V80 H144 C162.2 80 176 93.8 176 112 C176 130.2 162.2 144 144 144 H80 M144 144 L176 176" 
          stroke="white" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Pulse Effect at the Root Point -->
    <circle cx="176" cy="176" r="8" fill="#FF3D71">
      <animate attributeName="r" values="6;12;6" dur="2s" repeatCount="indefinite" />
      <animate attributeName="fill-opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>
  
  <!-- Connection Nodes -->
  <circle cx="128" cy="64" r="4" fill="url(#rca-grad)"/>
  <circle cx="192" cy="128" r="4" fill="url(#rca-grad)"/>
  <circle cx="128" cy="192" r="4" fill="url(#rca-grad)"/>
  <circle cx="64" cy="128" r="4" fill="url(#rca-grad)"/>
</svg>
