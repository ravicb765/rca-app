version: '3.8'

services:
  node-agent:
    build: ./node-agent
    privileged: true
    network_mode: host
    pid: host
    volumes:
      - /sys:/sys:ro
      - /sys/kernel/debug:/sys/kernel/debug
    environment:
      - RCA_APP_ENDPOINT=http://localhost:8080

  server:
    build: ./server
    ports:
      - "8080:8080"
    depends_on:
      - clickhouse
      - prometheus
    environment:
      - CLICKHOUSE_URL=clickhouse:9000
      - PROMETHEUS_URL=http://prometheus:9090
      - ML_SERVICE_URL=http://ml-service:5000

  ml-service:
    build: ./ml-service
    ports:
      - "5000:5000"

  backstage:
    build: ./backstage-portal
    ports:
      - "3000:7007"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    depends_on:
      - postgres

  postgres:
    image: postgres:13
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=backstage_plugin

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "9000:9000"
      - "8123:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse

  jaeger:
    image: jaegertracing/all-in-one:1.47
    ports:
      - "16686:16686"
      - "14268:14268"
      - "14250:14250"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-remote-write-receiver'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus

volumes:
  clickhouse-data:
  prometheus-data: