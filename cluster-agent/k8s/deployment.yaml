apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-agent
  namespace: observability
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9100"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cluster-agent
  template:
    metadata:
      labels:
        app: cluster-agent
    spec:
      containers:
        - name: cluster-agent
          image: ghcr.io/ravicb765/rca-app/cluster-agent:latest
          ports:
            - containerPort: 9100
          env:
            - name: PORT
              value: "9100"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9100
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9100
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
