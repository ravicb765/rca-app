global:
  resolve_timeout: 5m
  # Slack API URL (replace with your actual Incoming Webhook URL)
  slack_api_url: 'https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXXXXXXXXXXXXXXXXXX'

route:
  group_by: ['alertname', 'destination']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'slack-notifications' # Default receiver

  routes:
    # Route critical alerts to both Slack and Teams
    - match:
        severity: critical
      receiver: 'critical-notifications'
      continue: true

receivers:
- name: 'slack-notifications'
  slack_configs:
  - channel: '#observability'
    send_resolved: true
    title: '[{{ .Status | toUpper }}] {{ .CommonAnnotations.summary }}'
    text: >-
      {{ range .Alerts }}
        *Alert:* {{ .Annotations.summary }}
        *Description:* {{ .Annotations.description }}
        *Details:*
        {{ range .Labels.SortedPairs }} • *{{ .Name }}:* `{{ .Value }}`
        {{ end }}
      {{ end }}

- name: 'critical-notifications'
  webhook_configs:
  # Point this to your prometheus-msteams proxy or Teams webhook connector
  - url: 'http://prometheus-msteams:2000/alertmanager'